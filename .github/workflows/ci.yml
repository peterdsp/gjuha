name: CI

# Build and test Gjuha on every push and pull request.
#
# The project file is generated, not committed as the source of truth, so CI runs
# xcodegen first and then fails if generation produced a diff that was never
# committed. That keeps project.yml and Gjuha.xcodeproj from drifting apart.
#
# Note on runner images: Gjuha targets iOS 26, which GitHub-hosted images ship, so
# this job compiles and tests for real. The "select toolchain" step picks the
# newest installed Xcode and fails with an explicit message if no iOS 26+ SDK is
# present, rather than failing later with an unreadable compiler error.
#
# This used to target iOS 27, which no hosted runner has an SDK for, so the
# compile and test steps had to be skipped and nothing was actually verified. The
# floor was lowered to 26 precisely so that this pipeline means something.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Gjuha
  PROJECT: Gjuha.xcodeproj
  # TCA's macros are trusted through the Xcode GUI, which CI does not have.
  EXTRA_FLAGS: -skipMacroValidation

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select toolchain
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$newest" ]; then
            echo "::error::No Xcode found on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          echo "Installed iOS SDKs:"
          xcodebuild -showsdks | grep -i iphoneos || true
          # Gjuha targets iOS 26, which hosted runners do ship, so a missing SDK
          # here is a real problem rather than an expected limitation. Fail loudly
          # instead of skipping: a build that does not run protects nothing.
          if ! xcodebuild -showsdks | grep -qiE 'iOS 2[6-9]'; then
            echo "::error::This runner image has no iOS 26+ SDK, which Gjuha's deployment target requires."
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project and check it is committed
        run: |
          set -euo pipefail
          xcodegen generate
          # The generated pbxproj is committed. If generation changes it, the
          # committed copy is stale and the author needs to re-run xcodegen.
          if ! git diff --quiet -- "$PROJECT/project.pbxproj"; then
            echo "::error::Gjuha.xcodeproj/project.pbxproj is out of date. Run 'xcodegen generate' and commit the result."
            git --no-pager diff --stat -- "$PROJECT/project.pbxproj"
            exit 1
          fi

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | python3 Scripts/ci/pick_simulator.py)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            $EXTRA_FLAGS

      - name: No user-facing string ships untranslated
        # Runs after the build, because it compares the committed String
        # Catalogs against the keys the compiler just extracted.
        run: python3 Scripts/check_localization.py

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GjuhaTests \
            $EXTRA_FLAGS

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GjuhaUITests \
            $EXTRA_FLAGS

  android:
    name: Android build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Runs on Linux rather than macOS: the domain module is plain Kotlin on the
    # JVM and the app only needs the Android SDK to assemble, so there is no
    # reason to spend a macOS runner on it.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper
        # The wrapper jar is executable code committed to the repo, so its
        # checksum is checked against the published ones before it is run.
        uses: gradle/actions/wrapper-validation@v4

      - name: Domain tests
        working-directory: android
        run: ./gradlew :core:test --no-daemon --console=plain

      - name: Build the app
        working-directory: android
        # Also exercises the task that copies the iOS seed into assets, which
        # fails loudly if the content moves, so a seed relocation cannot pass CI
        # and break the Android build silently.
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore

  house-rules:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No em-dash in tracked text
        run: |
          set -euo pipefail
          # AGENTS.md hard rule 1: no em-dash anywhere in prose, code, or comments.
          # Only binaries are excluded. Albanian content is checked too, since the
          # rule is about authored text, not about language.
          # The escape, not the character: a literal one here would make this
          # check fail on its own source.
          if git grep -nI $'\u2014' -- . ':(exclude)*.png' ':(exclude)*.pdf' > /tmp/emdash.txt; then
            echo "::error::Em-dash found. AGENTS.md hard rule 1 forbids it."
            cat /tmp/emdash.txt
            exit 1
          fi
          echo "No em-dash found."

      - name: Android strings match the iOS catalog
        run: |
          set -euo pipefail
          # Both apps show the same copy and share one native review, so the
          # Android resources are generated from the iOS String Catalog rather
          # than translated twice. This fails if they have drifted, which would
          # mean a correction made on iOS never reached Android.
          python3 Scripts/sync_android_strings.py --check

      - name: Bundled seed content decodes and its references resolve
        run: |
          set -euo pipefail
          # Pure stdlib on purpose, so this job needs no dependency install.
          python3 Scripts/validate_seed.py

      - name: Palette is generated, committed, and above the contrast floor
        run: |
          set -euo pipefail
          # Two things in one step, because the generator is the only writer of
          # the colour catalog.
          #
          # It exits non-zero when any foreground/background pair it ships falls
          # below 4.5:1, so this enforces the contrast floor. And because it
          # regenerates every colorset from its own table, a diff afterwards means
          # someone edited the catalog in Xcode instead of the generator, which is
          # how a hand-tuned colour would slip past the floor entirely.
          #
          # GjuhaContrastTests covers the other half: that the colours the running
          # app resolves match these numbers. Both halves are needed, because this
          # step cannot see what the app renders and the test cannot see the
          # generator.
          python3 Scripts/gen_colors.py
          if ! git diff --quiet -- Gjuha/Resources/Palette.xcassets; then
            echo "::error::Palette.xcassets does not match Scripts/gen_colors.py. Edit the script's COLORS table and re-run it, rather than editing the catalog."
            git --no-pager diff --stat -- Gjuha/Resources/Palette.xcassets
            exit 1
          fi
          echo "Palette matches the generator and clears the contrast floor."

