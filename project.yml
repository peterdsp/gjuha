name: Gjuha
options:
  bundleIdPrefix: com.gjuha
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: 1.15.0

targets:
  Gjuha:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Gjuha
        excludes:
          - "**/*.md"
    resources:
      - path: Gjuha/Resources
        optional: true
    info:
      path: Gjuha/Info.plist
      properties:
        CFBundleDisplayName: Gjuha
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gjuha.app
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture

  GjuhaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GjuhaTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gjuha.tests
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: Gjuha
      - package: ComposableArchitecture
        product: ComposableArchitecture

  GjuhaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GjuhaUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gjuha.uitests
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: Gjuha
